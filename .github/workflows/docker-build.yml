name: Docker Image

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/GodwitProject/Godwit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # Use the short SHA as the image tag for pull requests (never pushed).
      - name: Compute image tag
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/pull/* ]]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            BRANCH="${REF#refs/heads/}"
            TAG="${BRANCH//\//-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
