name: Renovate

on:
  schedule:
    # Hourly dependency scan (no maintenance window: PRs are opened as soon as updates are found).
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: DEBUG
