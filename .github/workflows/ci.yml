name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Used by sqlx compile-time checks and DB-backed tests.
  DATABASE_URL: postgres://godwit:godwit@localhost:5432/godwit

jobs:
  build-and-test:
    name: cargo check + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: godwit
          POSTGRES_PASSWORD: godwit
          POSTGRES_DB: godwit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godwit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # samael (SAML) requires xmlsec1 + libclang at build time.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

  frontend-tests:
    name: frontend lint + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/admin/package-lock.json

      - name: Install apps/ui dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Install apps/admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Typecheck apps/ui
        working-directory: apps/ui
        run: npm run type-check

      - name: Test apps/ui
        working-directory: apps/ui
        run: npm test

      - name: Route-contract test apps/admin
        working-directory: apps/admin
        run: npx vitest run tests/route-contract.test.ts
