services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-godwit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-godwit}
      POSTGRES_DB: ${POSTGRES_DB:-godwit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-godwit} -d ${POSTGRES_DB:-godwit}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - godwit
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    volumes:
      - ${GODWIT_CONFIG:-./config.yaml}:/app/config.yaml
    environment:
      CONFIG_PATH: /app/config.yaml
      DATABASE_URL: postgres://${POSTGRES_USER:-godwit}:${POSTGRES_PASSWORD:-godwit}@db:5432/${POSTGRES_DB:-godwit}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - godwit
    restart: unless-stopped

  # Keycloak IdP for OIDC SSO. Optional: enable with the `keycloak` profile and
  # point the backend at the OIDC-enabled config:
  #   GODWIT_CONFIG=./config.keycloak.yaml docker compose --profile keycloak up
  # The realm + `godwit` client are provisioned from docker/keycloak/realm-export.json.
  # Login flow: http://localhost:3000/admin (browser) -> backend /api/v1/auth/oidc/keycloak
  # -> http://localhost:8081/realms/godwit. Seed user: admin / password123.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    profiles: ["keycloak"]
    networks:
      - godwit
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    depends_on:
      api:
        condition: service_healthy
    networks:
      - godwit
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - godwit
    restart: unless-stopped

  # Next.js UI (optional). If the multi-stage UI build fails (e.g. node runtime
  # SIGBUS on this host/kernel), add `-f docker-compose.ui.stub.yml` or comment
  # this service out. TODO: verify `next build` succeeds in the CI/registry
  # environment before relying on this service in production.
  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      # NEXT_PUBLIC_* values are inlined into the client bundle at build time
      # (see apps/ui/Dockerfile ARGs + next.config.js env block). Same-origin
      # auth requires the browser to talk ONLY to the UI origin (host port
      # 3002). next.config.js rewrites /api/v1/* to NEXT_PUBLIC_API_ORIGIN, so
      # in docker that must be the internal api service address (api:3000), NOT
      # a browser-reachable host. The api container itself is browser-exposed
      # on host port 8000 only for legacy tooling and must not be used for
      # cookie-authenticated flows.
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://api:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - godwit
    restart: unless-stopped

  # Legacy admin console (Next.js dev server from apps/admin).
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - api
    profiles: ["admin"]
    networks:
      - godwit

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  godwit:
    driver: bridge
