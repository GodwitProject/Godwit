[package]
name = "godwit-api"
version = "0.1.0"
edition = "2021"

[dependencies]
godwit-core = { path = "../godwit-core" }
godwit-db = { path = "../godwit-db" }
godwit-auth = { path = "../godwit-auth" }
godwit-providers = { path = "../godwit-providers" }
godwit-cache = { path = "../godwit-cache" }
axum = { version = "0.7", features = ["multipart"] }
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { version = "1.35", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
tracing = { workspace = true }
futures = "0.3"

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
rust_decimal_macros = "1.35"
# `ServiceExt::oneshot` drives the assembled Router in-process, with no TCP listener.
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
