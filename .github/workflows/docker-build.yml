name: Docker Image

# Build the image only AFTER the CI (tests) workflow completes successfully,
# so we never publish an image from a commit that broke the build/tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/GodwitProject/Godwit

jobs:
  build:
    runs-on: ubuntu-latest
    # Run only when CI passed on a branch/tag push (not on pull requests).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # The tag is the git branch name (for branch pushes) or the git tag name
      # (for tag pushes) — both are exposed as workflow_run.head_branch.
      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          TAG="${TAG//\//-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
