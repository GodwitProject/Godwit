[package]
name = "pasteurllm-api"
version = "0.1.0"
edition = "2021"

[dependencies]
pasteurllm-core = { path = "../pasteurllm-core" }
pasteurllm-db = { path = "../pasteurllm-db" }
pasteurllm-auth = { path = "../pasteurllm-auth" }
pasteurllm-providers = { path = "../pasteurllm-providers" }
pasteurllm-cache = { path = "../pasteurllm-cache" }
axum = "0.7"
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { version = "1.35", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
tracing = { workspace = true }

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
rust_decimal_macros = "1.35"
